<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Garage Billing System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    header {
      background: #172554;
      color: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }

    section {
      background: white;
      padding: 22px;
      margin: 22px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000015;
    }

    h2 {
      color: #1d4ed8;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
    }

    pre {
      background: #f1f5f9;
      padding: 18px;
      overflow-x: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-radius: 6px;
    }

    iframe {
      width: 100%;
      height: 650px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<header>
  <h1>T012-PS-041</h1>
  <h2 style="color:white;border:0">
    Parking Garage Billing System
  </h2>
  <p>Parking Billing with Slabs, Lost Tickets,
     Monthly Passes and EV Bays</p>
</header>

<section>
  <h2>1. README.md</h2>
  <pre id="readme">Loading README...</pre>
</section>

<section>
  <h2>2. main.py</h2>
  <pre id="main">Loading main.py...</pre>
</section>

<section>
  <h2>3. Design_Document.pdf</h2>
  <iframe src="./Design_Document.pdf"></iframe>
</section>

<section>
  <h2>4. test_suite.py</h2>
  <pre id="tests">Loading test_suite.py...</pre>
</section>

<section>
  <h2>5. decision_log.md</h2>
  <pre id="decisions">Loading decision_log.md...</pre>
</section>

<script>
async function loadFile(file, elementId) {
  try {
    const response = await fetch("./" + file);

    if (!response.ok) {
      throw new Error("File not found");
    }

    const content = await response.text();
    document.getElementById(elementId).textContent = content;

  } catch (error) {
    document.getElementById(elementId).textContent =
      "Unable to load " + file +
      ". Please check the filename and location.";
  }
}

loadFile("README.md", "readme");
loadFile("main.py", "main");
loadFile("test_suite.py", "tests");
loadFile("decision_log.md", "decisions");
</script>

</body>
</html>
